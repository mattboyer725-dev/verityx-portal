# Cloud Run service contract for VerityX.
# Substitute PROJECT, REGION, INSTANCE, IMAGE, then:
#   gcloud run services replace gcp/service.yaml --region=$REGION
#
# Prefer `./gcp/deploy.sh` (Cloud Build). This YAML is the reviewed contract.
# Startup and readiness hit /health/ready so a revision does not take traffic
# until Cloud SQL answers. Liveness is /health/live so a brief DB blip does
# not kill the process.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: verityx
  labels:
    app: verityx
    stack: tanstack
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      labels:
        app: verityx
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "8"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cloudsql-instances: PROJECT:REGION:INSTANCE
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: verityx-run@PROJECT.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - image: IMAGE
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: NITRO_HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: NITRO_PORT
              value: "8080"
            - name: GCP_RUNTIME
              value: "1"
            - name: NODE_ENV
              value: production
            - name: VITE_AUTH_ENABLED
              value: "true"
            - name: CLOUD_SQL_CONNECTION_NAME
              value: PROJECT:REGION:INSTANCE
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: verityx-database-url
                  key: latest
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: verityx-better-auth-secret
                  key: latest
            - name: BETTER_AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: verityx-better-auth-url
                  key: latest
            - name: GROK_AUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: verityx-grok-auth-client-id
                  key: latest
            - name: GROK_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: verityx-grok-auth-client-secret
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 16
            timeoutSeconds: 15
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3

name: Ledger race

# Six processes, each a cold "server instance", append concurrently through
# withLedger() against a real Postgres. The chain must end with one genesis,
# every write committed, and a valid HMAC/Merkle chain — no fork.
on:
  push:
    paths: ["src/lib/core-store.server.ts", "src/lib/core-ledger.ts", "src/lib/db.ts", "migrations/**", "scripts/ledger-race/**"]
  workflow_dispatch: {}

jobs:
  race:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: verityx_app
          POSTGRES_PASSWORD: x
          POSTGRES_DB: vx
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://verityx_app:x@localhost:5432/vx
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm i --no-save --ignore-scripts vite-node@3
      - run: node scripts/migrate.mjs
      - name: Six concurrent writers
        run: |
          export LOCAL_CORE_SECRET=$(openssl rand -hex 32)
          echo "LOCAL_CORE_SECRET=$LOCAL_CORE_SECRET" >> "$GITHUB_ENV"
          pids=""; for i in 1 2 3 4 5 6; do npx vite-node --config scripts/ledger-race/vite.config.mjs scripts/ledger-race/writer.ts $i & pids="$pids $!"; done; for p in $pids; do wait $p; done
      - name: One chain, every write, valid
        run: npx vite-node --config scripts/ledger-race/vite.config.mjs scripts/ledger-race/check.ts 64
